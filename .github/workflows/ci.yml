name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run gen:all

      - run: npm run typecheck

      # Tier 1 only. The tier-2 corpus gate (npm run test:corpus) needs
      # SQL_CORPUS_DIR, a proprietary corpus that isn't published — the gate
      # self-skips without it, so it isn't run here.
      #
      # Excluded, tracked pre-existing gaps (not packaging-related, found by
      # this being the first-ever non-Windows run of the suite):
      #  - bigquery.analyzer-schema / tsql.adventureworks / organize-corpus:
      #    hard-require SQL_CORPUS_DIR instead of skipIf-ing its absence like
      #    the rest of the corpus-gated tests do (verified exhaustively via
      #    `grep -rl helpers/corpus tests tools`, outside tests/corpus/ —
      #    these three are the only ones).
      #  - minijinja.segment-golden: golden expected-values are multi-line
      #    template literals with physical CRLF embedded in the .ts source,
      #    so `.gitattributes`' platform-native checkout (CRLF on Windows, LF
      #    on Linux) changes the golden string itself.
      - run: >-
          npx vitest run
          --exclude tests/bigquery.analyzer-schema.test.ts
          --exclude tests/tsql.adventureworks.test.ts
          --exclude tools/organize-corpus.test.ts
          --exclude tests/minijinja.segment-golden.test.ts
