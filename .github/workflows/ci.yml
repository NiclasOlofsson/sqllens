name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run gen:all

      - run: npm run typecheck

      # Tier 1 only. The tier-2 corpus gate (npm run test:corpus) needs
      # SQL_CORPUS_DIR, a proprietary corpus that isn't published — the gate
      # self-skips without it, so it isn't run here.
      - run: npm test
