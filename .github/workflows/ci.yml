name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run gen:all

      - run: npm run typecheck

      # Tier 1 only. The tier-2 corpus gate (npm run test:corpus) needs
      # SQL_CORPUS_DIR, a proprietary corpus that isn't published — the gate
      # self-skips without it, so it isn't run here.
      #
      # No exclusions: the four tests that hard-failed here (first-ever
      # non-Windows run of the suite) are fixed at the root, not worked
      # around — bigquery.analyzer-schema / tsql.adventureworks relocated
      # into tests/corpus/ (already tier-2-only by the existing vitest
      # config); organize-corpus's corpus-path resolution made lazy so its
      # own describe.skipIf(!ORGANIZE) actually protects it; the minijinja
      # golden gate's fixtures pinned to `eol=lf` in .gitattributes so the
      # checked-out bytes (and its byte-exact comparison) are platform-
      # identical. Verified by running with SQL_CORPUS_DIR and .env both
      # absent, matching this runner's environment exactly.
      - run: npm test
